<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Volunteer Hub</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17213b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,440px);background:#fff;padding:36px;border:1px solid #e5eaf4;border-radius:22px;box-shadow:0 18px 55px #17213b12}.brand{font-weight:800;font-size:20px;text-decoration:none;color:#17213b}.brand span{display:inline-grid;place-items:center;background:#2563eb;color:white;border-radius:10px;width:32px;height:32px;margin-right:8px}.eyebrow{color:#2563eb;font-weight:700;font-size:13px;margin:28px 0 8px}h1{font-size:30px;letter-spacing:-.8px;margin:0 0 10px}p{color:#667085;line-height:1.6;margin:0 0 24px}.field{display:block;font-size:14px;font-weight:650;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #d5ddeb;border-radius:10px;font:inherit}input:focus{outline:3px solid #2563eb22;border-color:#2563eb}.submit{margin-top:22px;width:100%;padding:14px;border:0;border-radius:10px;background:#2563eb;color:#fff;font:inherit;font-weight:750;cursor:pointer}.note{font-size:12px;margin:16px 0 0}.bottom{text-align:center;margin-top:22px;font-size:14px}.bottom a{color:#2563eb;font-weight:700;text-decoration:none}.back{display:block;text-align:center;color:#667085;text-decoration:none;font-size:13px;margin-top:18px}
  </style>
</head>
<body><main class="card">
  <a class="brand" href="Index.html"><span>✦</span>Volunteer Hub</a>
  <div class="eyebrow">WELCOME BACK</div>
  <h1>Log in</h1>
  <p>Sign in to continue finding ways to help your community.</p>
  <form id="login-form">
    <label class="field" for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
    <label class="field" for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password">
    <button class="submit" type="submit">Log in</button>
  </form>
  <p class="note">Demo page only: login is not connected to Clerk or a database yet. Do not enter a real password.</p>
  <div class="bottom">New to Volunteer Hub? <a href="signup.html">Create an account</a></div>
  <a class="back" href="Index.html">← Back to Volunteer Hub</a>
</main><script>document.getElementById('login-form').addEventListener('submit',function(e){e.preventDefault();alert('This page is only the login interface. Clerk authentication still needs to be connected before sign-in can work.');});</script></body></html>
