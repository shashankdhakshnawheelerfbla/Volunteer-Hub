  <!-- Opens or closes the `title` element in the document structure. -->

  <title>Log In | Volunteer Hub</title>
  <!-- Opens or closes the `style` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  <style>
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    :root { color-scheme: light; --blue:#2563eb; --ink:#172033; --muted:#64748b; --line:#dbe2ec; }
    * { box-sizing:border-box; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:radial-gradient(ellipse at top left,#e6efff 0,transparent 45%),#f5f7fb; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .card { width:100%; max-width:460px; padding:34px; background:#fff; border:1px solid #e8edf5; border-radius:22px; box-shadow:0 20px 65px #1e293b12; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .brand { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:800; letter-spacing:2px; color:var(--blue); }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .brand-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:11px; color:#fff; background:var(--blue); letter-spacing:0; font-size:17px; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    h1 { margin:26px 0 8px; font-size:30px; letter-spacing:-.7px; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .description { margin:0 0 24px; color:var(--muted); line-height:1.6; font-size:14px; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    label { display:block; margin:16px 0 8px; font-size:13px; font-weight:700; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    input { width:100%; padding:13px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:15px; background:#fff; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    input:focus { outline:3px solid #2563eb20; border-color:var(--blue); }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    button,.provider { width:100%; min-height:46px; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:14px; font-weight:700; text-decoration:none; cursor:pointer; transition:background .15s,border-color .15s; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .primary { margin-top:20px; color:#fff; border-color:var(--blue); background:var(--blue); }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .primary:hover { background:#1d4ed8; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .provider { color:var(--ink); background:#fff; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .provider:hover { background:#f8fafc; border-color:#94a3b8; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .provider-list { display:grid; gap:10px; margin-top:16px; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .provider-icon { display:inline-grid; place-items:center; min-width:20px; font-size:17px; font-weight:800; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .separator { display:flex; align-items:center; gap:12px; margin:20px 0 2px; color:#94a3b8; font-size:12px; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .separator:before,.separator:after { content:""; height:1px; flex:1; background:#e8edf5; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    .footer { margin:24px 0 0; text-align:center; font-size:13px; color:var(--muted); }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    a.text-link { color:var(--blue); font-weight:700; text-decoration:none; }
    #message { min-height:18px; margin:16px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
    #message.error { color:#b42318; }
    /* Selects the HTML elements that receive the style rules below. */
    /* The declarations inside this block control their visual presentation. */
    button:disabled { opacity:.65; cursor:wait; }
    /* Starts a CSS at-rule, such as a responsive or reusable style rule. */
    /* The enclosed rules apply under the condition or context specified here. */
    @media(max-width:480px) { .card { padding:26px 21px; } h1 { font-size:27px; } }
  /* Executes the statement or expression written on this line. */
  /* It contributes to the behavior of this file at this point in the workflow. */
  </style>

<!-- This element organizes page content or provides information to the browser. -->
</head>
<!-- Opens or closes the `body` element in the document structure. -->
<!-- This element organizes page content or provides information to the browser. -->
<body>
  <!-- Opens or closes the `main` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  <main class="card">
    <!-- Opens or closes the `div` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <div class="brand"><span class="brand-mark" aria-hidden="true">V</span> VOLUNTEER HUB</div>
    <!-- Opens or closes the `h1` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <h1>Welcome back</h1>
    <!-- Opens or closes the `p` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <p class="description">Sign in to discover opportunities and manage your volunteer activities.</p>

    <!-- Opens or closes the `form` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <form id="login-form">
      <!-- Opens or closes the `label` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <label for="email">Email address</label>
      <!-- Opens or closes the `input` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" maxlength="254" required>
      <!-- Opens or closes the `label` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <label for="password">Password</label>
      <!-- Opens or closes the `input` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
      <!-- Opens or closes the `button` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <button class="primary" id="login-submit" type="submit">Log in</button>
    <!-- Opens or closes the `form` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    </form>

    <!-- Opens or closes the `div` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <div class="separator">or continue with</div>
    <!-- Opens or closes the `div` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <div class="provider-list" aria-label="Other sign-in options">
      <!-- Opens or closes the `a` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <a class="provider" href="/auth/google/start"><span class="provider-icon" aria-hidden="true">G</span> Continue with Google</a>
      <!-- Opens or closes the `a` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <a class="provider" href="/auth/microsoft/start"><span class="provider-icon" aria-hidden="true">⊞</span> Continue with Microsoft</a>
      <!-- Opens or closes the `a` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <a class="provider" href="/auth/apple/start"><span class="provider-icon" aria-hidden="true">●</span> Continue with Apple</a>
    <!-- Opens or closes the `div` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    </div>

    <!-- Opens or closes the `p` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <p class="footer">Don't have an account? <a class="text-link" href="/templates/signup.html">Create one</a></p>
    <!-- Opens or closes the `p` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <p id="message" role="status" aria-live="polite"></p>
  <!-- Opens or closes the `main` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  </main>
  <!-- Opens or closes the `script` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  <script>
    // Assigns a value to `form` for later use.
    // Other statements can read this value to make decisions or perform work.
    const form = document.getElementById('login-form');
    // Assigns a value to `message` for later use.
    // Other statements can read this value to make decisions or perform work.
    const message = document.getElementById('message');
    // Assigns a value to `submit` for later use.
    // Other statements can read this value to make decisions or perform work.
    const submit = document.getElementById('login-submit');
    // Assigns a value to `errorMessages` for later use.
    // Other statements can read this value to make decisions or perform work.
    const errorMessages = {
      // Executes the statement or expression written on this line.
      // It contributes to the behavior of this file at this point in the workflow.
      provider_not_configured: 'That sign-in provider is not configured yet. Please use email and password or try again later.',
      // Executes the statement or expression written on this line.
      // It contributes to the behavior of this file at this point in the workflow.
      account_exists: 'An account already exists with this email. Sign in with the method you originally used.',
      // Executes the statement or expression written on this line.
      // It contributes to the behavior of this file at this point in the workflow.
      provider_signin_failed: 'Sign-in was not completed. Please try again.',
    // Defines or closes part of a structured data object or configuration block.
    // Its position and punctuation determine how the surrounding data is grouped.
    };
    // Assigns a value to `params` for later use.
    // Other statements can read this value to make decisions or perform work.
    const params = new URLSearchParams(location.search);
    // Checks a condition or selects a branch of the program.
    // The following block runs only when this branch's rule applies.
    if (params.has('error')) {
      // Sets or updates `message.textContent` using the expression on the right-hand side.
      // The assigned value is used by later logic or by the current configuration.
      message.textContent = errorMessages[params.get('error')] || 'Sign-in failed. Please try again.';
      // Executes the statement or expression written on this line.
      // It contributes to the behavior of this file at this point in the workflow.
      message.classList.add('error');
      // Executes the statement or expression written on this line.
      // It contributes to the behavior of this file at this point in the workflow.
      history.replaceState({}, document.title, location.pathname);
    // Defines or closes part of a structured data object or configuration block.
    // Its position and punctuation determine how the surrounding data is grouped.
    }
    // Opens a block that groups related statements together.
    // The matching closing brace marks where this block ends.
    form.addEventListener('submit', async (event) => {
      // Executes the statement or expression written on this line.
      // It contributes to the behavior of this file at this point in the workflow.
      event.preventDefault();
      // Sets or updates `message.textContent` using the expression on the right-hand side.
      // The assigned value is used by later logic or by the current configuration.
      message.textContent = 'Signing you in…';
      // Executes the statement or expression written on this line.
      // It contributes to the behavior of this file at this point in the workflow.
      message.classList.remove('error');
      // Sets or updates `submit.disabled` using the expression on the right-hand side.
      // The assigned value is used by later logic or by the current configuration.
      submit.disabled = true;
      // Begins an error-handling section or its related handler.
      // This lets the program handle failures without silently ignoring them.
      try {
        // Assigns a value to `response` for later use.
        // Other statements can read this value to make decisions or perform work.
        const response = await fetch('/auth/login', {
          // Executes the statement or expression written on this line.
          // It contributes to the behavior of this file at this point in the workflow.
          method: 'POST', credentials: 'same-origin',
          // Executes the statement or expression written on this line.
          // It contributes to the behavior of this file at this point in the workflow.
          headers: { 'Content-Type': 'application/json' },
          // Executes the statement or expression written on this line.
          // It contributes to the behavior of this file at this point in the workflow.
          body: JSON.stringify({ email: form.email.value, password: form.password.value })
        // Defines or closes part of a structured data object or configuration block.
        // Its position and punctuation determine how the surrounding data is grouped.
        });
        // Assigns a value to `result` for later use.
        // Other statements can read this value to make decisions or perform work.
        const result = await response.json();
        // Checks a condition or selects a branch of the program.
        // The following block runs only when this branch's rule applies.
        if (!response.ok) throw new Error(result.error || 'Sign-in failed. Please try again.');
        // Executes the statement or expression written on this line.
        // It contributes to the behavior of this file at this point in the workflow.
        location.assign('/templates/dashboard.html');
      // Defines or closes part of a structured data object or configuration block.
      // Its position and punctuation determine how the surrounding data is grouped.
      } catch (error) {
        // Sets or updates `message.textContent` using the expression on the right-hand side.
        // The assigned value is used by later logic or by the current configuration.
        message.textContent = error.message || 'We could not sign you in. Please try again.';
        // Executes the statement or expression written on this line.
        // It contributes to the behavior of this file at this point in the workflow.
        message.classList.add('error');
        // Sets or updates `submit.disabled` using the expression on the right-hand side.
        // The assigned value is used by later logic or by the current configuration.
        submit.disabled = false;
      // Defines or closes part of a structured data object or configuration block.
      // Its position and punctuation determine how the surrounding data is grouped.
      }
    // Defines or closes part of a structured data object or configuration block.
    // Its position and punctuation determine how the surrounding data is grouped.
    });
  // Executes the statement or expression written on this line.
  // It contributes to the behavior of this file at this point in the workflow.
  </script>
<!-- Opens or closes the `body` element in the document structure. -->
<!-- This element organizes page content or provides information to the browser. -->
</body>
