
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Volunteer Hub</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f6fc;
      color: #172033;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 40px #17203312;
    }

    .brand {
      color: #2563eb;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 { margin-bottom: 8px; }

    .description {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 16px;
      background: white;
    }

    button, .google-button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      background: #2563eb;
      color: white;
    }

    .google-button {
      margin-top: 12px;
      border: 1px solid #cbd5e1;
      background: white;
      color: #172033;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
    }

    a { color: #2563eb; }

    #message {
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">VOLUNTEER HUB</div>

    <h1>Create your account</h1>
    <p class="description">
      Join your community and find opportunities to make a difference.
    </p>

    <form id="signup-form">
      <label for="name">Full name</label>
      <input
        id="name"
        name="name"
        type="text"
        autocomplete="name"
        placeholder="Your full name"
        required
      >

      <label for="email">Email address</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="you@example.com"
        required
      >

      <label for="role">Account type</label>
      <select id="role" name="role" required>
        <option value="volunteer">Volunteer</option>
        <option value="organizer">Volunteer organizer</option>
      </select>

      <label for="password">Create password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="At least 8 characters"
        required
      >

      <button type="submit">Create Account</button>
    </form>

    <a class="google-button" href="/auth/google/start">
      Sign Up with Google
    </a>

    <p class="footer">
      Already have an account?
      <a href="/templates/login.html">Log in</a>
    </p>

    <p id="message" role="status">
      Account creation needs a secure backend before accounts can be saved.
    </p>
  </main>

  <script>
    document.getElementById("signup-form").addEventListener("submit", event => {
      event.preventDefault();

      document.getElementById("message").textContent =
        "The form is ready, but account creation is not connected to a server yet.";
    });
  </script>
</body>
</html>
