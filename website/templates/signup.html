<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Create Account | Volunteer Hub</title>
  <style>
    :root { color-scheme:light; --blue:#2563eb; --ink:#172033; --muted:#64748b; --line:#dbe2ec; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:radial-gradient(ellipse at top left,#e6efff 0,transparent 45%),#f5f7fb; }
    .card { width:100%; max-width:470px; padding:32px 34px; background:#fff; border:1px solid #e8edf5; border-radius:22px; box-shadow:0 20px 65px #1e293b12; }
    .brand { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:800; letter-spacing:2px; color:var(--blue); }
    .brand-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:11px; color:#fff; background:var(--blue); letter-spacing:0; font-size:17px; }
    h1 { margin:24px 0 8px; font-size:29px; letter-spacing:-.7px; }
    .description { margin:0 0 22px; color:var(--muted); line-height:1.6; font-size:14px; }
    label { display:block; margin:14px 0 8px; font-size:13px; font-weight:700; }
    input,select { width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:15px; background:#fff; }
    input:focus,select:focus { outline:3px solid #2563eb20; border-color:var(--blue); }
    button,.provider { width:100%; min-height:45px; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; font-size:14px; font-weight:700; text-decoration:none; cursor:pointer; }
    .primary { margin-top:20px; color:#fff; border-color:var(--blue); background:var(--blue); }
    .primary:hover { background:#1d4ed8; }
    .provider { color:var(--ink); background:#fff; }
    .provider:hover { background:#f8fafc; border-color:#94a3b8; }
    .provider-list { display:grid; gap:9px; margin-top:14px; }
    .provider-icon { display:inline-grid; place-items:center; min-width:20px; font-size:17px; font-weight:800; }
    .separator { display:flex; align-items:center; gap:12px; margin:19px 0 0; color:#94a3b8; font-size:12px; }
    .separator:before,.separator:after { content:""; height:1px; flex:1; background:#e8edf5; }
    .footer { margin:22px 0 0; text-align:center; font-size:13px; color:var(--muted); }
    .text-link { color:var(--blue); font-weight:700; text-decoration:none; }
    #message { min-height:18px; margin:14px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
    #message.error { color:#b42318; }
    button:disabled { opacity:.65; cursor:wait; }
    @media(max-width:480px) { .card { padding:25px 21px; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><span class="brand-mark" aria-hidden="true">V</span> VOLUNTEER HUB</div>
    <h1>Create your account</h1>
    <p class="description">Join your community and find opportunities to make a difference.</p>

    <form id="signup-form">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" placeholder="Your full name" minlength="2" maxlength="100" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
      <label for="role">Account type</label>
      <select id="role" name="role" required>
        <option value="volunteer">Volunteer</option>
        <option value="organizer">Volunteer organizer</option>
      </select>
      <label for="password">Create password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" placeholder="At least 12 characters" required>
      <button class="primary" id="signup-submit" type="submit">Create account</button>
    </form>

    <div class="separator">or sign up with</div>
    <div class="provider-list" aria-label="Other sign-up options">
      <a class="provider oauth-link" data-provider="google" href="/auth/google/start"><span class="provider-icon" aria-hidden="true">G</span> Sign up with Google</a>
      <a class="provider oauth-link" data-provider="microsoft" href="/auth/microsoft/start"><span class="provider-icon" aria-hidden="true">⊞</span> Sign up with Microsoft</a>
      <a class="provider oauth-link" data-provider="apple" href="/auth/apple/start"><span class="provider-icon" aria-hidden="true">●</span> Sign up with Apple</a>
    </div>

    <p class="footer">Already have an account? <a class="text-link" href="/templates/login.html">Log in</a></p>
    <p id="message" role="status" aria-live="polite"></p>
  </main>
  <script>
    const form = document.getElementById('signup-form');
    const message = document.getElementById('message');
    const submit = document.getElementById('signup-submit');
    document.querySelectorAll('.oauth-link').forEach((link) => {
      link.addEventListener('click', () => {
        const role = document.getElementById('role').value;
        link.href = `/auth/${link.dataset.provider}/start?role=${encodeURIComponent(role)}`;
      });
    });
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = 'Creating your account…';
      message.classList.remove('error');
      submit.disabled = true;
      try {
        const response = await fetch('/auth/register', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: form.name.value, email: form.email.value, role: form.role.value, password: form.password.value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'We could not create your account. Please try again.');
        location.assign('/templates/dashboard.html');
      } catch (error) {
        message.textContent = error.message || 'We could not create your account. Please try again.';
        message.classList.add('error');
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
