<html lang="en">
<!-- Opens or closes the `head` element in the document structure. -->

<head>
  <!-- Opens or closes the `meta` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  <meta charset="utf-8">
  <!-- Opens or closes the `meta` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Opens or closes the `title` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  <title>Your Account | Volunteer Hub</title>
  <!-- Opens or closes the `style` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033;display:grid;place-items:center}.card{width:100%;max-width:620px;background:#fff;border:1px solid #e5eaf2;border-radius:20px;padding:32px;box-shadow:0 16px 50px #17203310}.brand{color:#2563eb;font-size:12px;font-weight:800;letter-spacing:2px}.status{color:#64748b;font-size:14px;line-height:1.6}.detail{padding:14px 0;border-bottom:1px solid #edf0f5}.label{display:block;color:#64748b;font-size:12px;margin-bottom:5px}.value{font-weight:650;overflow-wrap:anywhere}button{margin-top:24px;border:0;border-radius:10px;background:#2563eb;color:white;padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer}#message{color:#b42318;font-size:13px}
  /* Executes the statement or expression written on this line. */
  /* It contributes to the behavior of this file at this point in the workflow. */
  </style>
<!-- Opens or closes the `head` element in the document structure. -->
<!-- This element organizes page content or provides information to the browser. -->
</head>
<!-- Opens or closes the `body` element in the document structure. -->
<!-- This element organizes page content or provides information to the browser. -->
<body>
  <!-- Opens or closes the `main` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  <main class="card">
    <!-- Opens or closes the `div` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <div class="brand">VOLUNTEER HUB</div>
    <!-- Opens or closes the `h1` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <h1>Your account</h1>
    <!-- Opens or closes the `p` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <p class="status" id="status">Checking your sign-in session…</p>
    <!-- Opens or closes the `section` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    <section id="account" hidden>
      <!-- Opens or closes the `div` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <div class="detail"><span class="label">Full name</span><span class="value" id="name"></span></div>
      <!-- Opens or closes the `div` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <div class="detail"><span class="label">Email address</span><span class="value" id="email"></span></div>
      <!-- Opens or closes the `div` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <div class="detail"><span class="label">Account type</span><span class="value" id="role"></span></div>
      <!-- Opens or closes the `button` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <button id="logout" type="button">Sign out</button>
      <!-- Opens or closes the `p` element in the document structure. -->
      <!-- This element organizes page content or provides information to the browser. -->
      <p id="message" role="status"></p>
    <!-- Opens or closes the `section` element in the document structure. -->
    <!-- This element organizes page content or provides information to the browser. -->
    </section>
  <!-- Opens or closes the `main` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  </main>
  <!-- Opens or closes the `script` element in the document structure. -->
  <!-- This element organizes page content or provides information to the browser. -->
  <script>
    // Assigns a value to `statusText` for later use.
    // Other statements can read this value to make decisions or perform work.
    const statusText = document.getElementById('status');
    // Declares a function or function-valued variable for a reusable operation.
    // The body defines what happens when this operation is called.
    async function loadAccount() {
      // Begins an error-handling section or its related handler.
      // This lets the program handle failures without silently ignoring them.
      try {
        // Assigns a value to `response` for later use.
        // Other statements can read this value to make decisions or perform work.
        const response = await fetch('/auth/me', { credentials: 'same-origin', cache: 'no-store' });
        // Checks a condition or selects a branch of the program.
        // The following block runs only when this branch's rule applies.
        if (!response.ok) { location.replace('/templates/login.html'); return; }
        // Assigns a value to `result` for later use.
        // Other statements can read this value to make decisions or perform work.
        const result = await response.json();
        // Connects application behavior to an event, route, browser feature, or response.
        // This line helps link the current operation to the rest of the application.
        document.getElementById('name').textContent = result.user.name;
        // Connects application behavior to an event, route, browser feature, or response.
        // This line helps link the current operation to the rest of the application.
        document.getElementById('email').textContent = result.user.email;
        // Connects application behavior to an event, route, browser feature, or response.
        // This line helps link the current operation to the rest of the application.
        document.getElementById('role').textContent = result.user.role === 'organizer' ? 'Volunteer organizer' : 'Volunteer';
        // Connects application behavior to an event, route, browser feature, or response.
        // This line helps link the current operation to the rest of the application.
        document.getElementById('account').hidden = false;
        // Sets or updates `statusText.textContent` using the expression on the right-hand side.
        // The assigned value is used by later logic or by the current configuration.
        statusText.textContent = 'You are signed in.';
      // Defines or closes part of a structured data object or configuration block.
      // Its position and punctuation determine how the surrounding data is grouped.
      } catch {
        // Sets or updates `statusText.textContent` using the expression on the right-hand side.
        // The assigned value is used by later logic or by the current configuration.
        statusText.textContent = 'We could not check your session. Please try again.';
      // Defines or closes part of a structured data object or configuration block.
      // Its position and punctuation determine how the surrounding data is grouped.
      }
    // Defines or closes part of a structured data object or configuration block.
    // Its position and punctuation determine how the surrounding data is grouped.
    }
    // Opens a block that groups related statements together.
    // The matching closing brace marks where this block ends.
    document.getElementById('logout').addEventListener('click', async () => {
      // Assigns a value to `button` for later use.
      // Other statements can read this value to make decisions or perform work.
      const button = document.getElementById('logout');
      // Sets or updates `button.disabled` using the expression on the right-hand side.
      // The assigned value is used by later logic or by the current configuration.
      button.disabled = true;
      // Begins an error-handling section or its related handler.
      // This lets the program handle failures without silently ignoring them.
      try {
        // Assigns a value to `response` for later use.
        // Other statements can read this value to make decisions or perform work.
        const response = await fetch('/auth/logout', { method: 'POST', credentials: 'same-origin' });
        // Checks a condition or selects a branch of the program.
        // The following block runs only when this branch's rule applies.
        if (!response.ok) throw new Error('Sign-out failed. Please try again.');
        // Executes the statement or expression written on this line.
        // It contributes to the behavior of this file at this point in the workflow.
        location.replace('/templates/login.html');
      // Defines or closes part of a structured data object or configuration block.
      // Its position and punctuation determine how the surrounding data is grouped.
      } catch (error) {
        // Connects application behavior to an event, route, browser feature, or response.
        // This line helps link the current operation to the rest of the application.
        document.getElementById('message').textContent = error.message;
        // Sets or updates `button.disabled` using the expression on the right-hand side.
        // The assigned value is used by later logic or by the current configuration.
        button.disabled = false;
      // Defines or closes part of a structured data object or configuration block.
      // Its position and punctuation determine how the surrounding data is grouped.
      }
    // Defines or closes part of a structured data object or configuration block.
    // Its position and punctuation determine how the surrounding data is grouped.
    });
    // Executes the statement or expression written on this line.
    // It contributes to the behavior of this file at this point in the workflow.
    loadAccount();
  // Executes the statement or expression written on this line.
  // It contributes to the behavior of this file at this point in the workflow.
  </script>
<!-- Opens or closes the `body` element in the document structure. -->

</body>
