
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | Volunteer Hub</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, sans-serif;
      color: #17213b;
      background: #f4f7fc;
    }

    .card {
      width: min(100%, 440px);
      padding: 32px;
      background: white;
      border: 1px solid #e5eaf4;
      border-radius: 22px;
      box-shadow: 0 18px 55px #17213b12;
    }

    .brand {
      display: block;
      margin-bottom: 24px;
      font-size: 20px;
      font-weight: 800;
      color: #17213b;
      text-decoration: none;
    }

    .brand span {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      margin-right: 8px;
      color: white;
      background: #2563eb;
      border-radius: 10px;
    }

    h1 { margin-bottom: 8px; }

    p {
      color: #667085;
      line-height: 1.6;
    }

    #sign-in {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .back {
      display: block;
      margin-top: 24px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    #status {
      color: #667085;
      text-align: center;
    }
  </style>

  <script
    defer
    crossorigin="anonymous"
    src="https://renewing-frog-4859.clerk.accounts.dev/npm/@clerk/ui@1/dist/ui.browser.js"
    type="text/javascript">
  </script>

  <script
    defer
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_test_cmVuZXdpbmctZnJvZy00ODU5LmNsZXJrLmFjY291bnRzLmRldiQ"
    src="https://renewing-frog-4859.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js"
    type="text/javascript">
  </script>
</head>

<body>
  <main class="card">
    <a class="brand" href="index.html">
      <span>✦</span>Volunteer Hub
    </a>

    <h1>Log in</h1>
    <p>Sign in to continue finding ways to help your community.</p>

    <div id="sign-in"></div>
    <p id="status" role="status">Loading secure sign-in…</p>

    <a class="back" href="index.html">← Back to Volunteer Hub</a>
  </main>

  <script>
    window.addEventListener("load", async function () {
      const status = document.getElementById("status");

      try {
        await Clerk.load({
          ui: { ClerkUI: window.__internal_ClerkUICtor }
        });

        status.remove();

        if (Clerk.isSignedIn) {
          window.location.href = "index.html";
          return;
        }

        Clerk.mountSignIn(document.getElementById("sign-in"));
      } catch (error) {
        console.error("Clerk initialization failed:", error);
        status.textContent =
          "Sign-in could not load. Please refresh or try again later.";
      }
    });
  </script>
</body>
</html>
